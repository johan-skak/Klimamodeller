years: 100 # Number of years to simulate
dt_years: 0.02 # Time step in years
nx: 200 # Number of grid points in x-direction (x = sin(latitude))
modes: !!seq # List of model modes to use. Possible modes are: SeasonalVariation, VariableSeaDepth
    - VariableSeaDepth
    - SeasonalVariation
ctrl_years: 0 # Number of years to run control without forcing. Set to -1 to have half the simulation as control.
